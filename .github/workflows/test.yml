name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libdecor-0-dev \
            libfribidi-dev \
            librsvg2-2 \
            libswresample-dev \
            libswscale-dev \
            libturbojpeg \
            libudev-dev \
            libusb-1.0-0-dev \
            libutf8proc-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxext-dev \
            libxi-dev \
            libxkbcommon-dev \
            pkg-config
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig fmt --check src build.zig build.zig.zon
      - name: Fetch native accessibility dependencies
        run: cargo fetch --locked --manifest-path src/v7_host/accesskit_bridge/Cargo.toml
      - run: zig build test
      - run: zig build check
      - run: zig build layout-check
      - run: zig build test check -Doptimize=safe
      - run: zig build --build-file vendor/noapi/build.zig test -Denable-tracy=false
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
